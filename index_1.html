<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFD43B">
<meta name="description" content="Psych: the bluffing party game. Make up answers, catch your friends lying.">
<title>Psych</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Bengali:wght@400;600&display=swap">
<style>
/* Layout: one phone-width column, Kolkata-taxi yellow ground, ink-bordered game cards with hard offset shadows. */
:root{
  --bg:#FFD43B; --surface:#FFFBEA; --surface-2:#FFF3C4; --ink:#1A1712; --muted:#5D5545;
  --line:#1A1712; --shadow:#1A1712; --btn:#1A1712; --btn-fg:#FFD43B;
  --lie:#C8255F; --lie-soft:#FBD9E6; --truth:#0B7F70; --truth-soft:#CDEFE9; --warn:#9A5B00;
  --display:"Bungee", "Arial Black", Impact, sans-serif;
  --body:"Figtree", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16140F; --surface:#221F18; --surface-2:#2C281F; --ink:#F6F0DC; --muted:#AAA18A;
  --line:#4C4535; --shadow:#000000; --btn:#FFD43B; --btn-fg:#16140F;
  --lie:#FF6FA3; --lie-soft:#3A1E29; --truth:#3CD3BB; --truth-soft:#173430; --warn:#FFB547; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#16140F; --surface:#221F18; --surface-2:#2C281F; --ink:#F6F0DC; --muted:#AAA18A;
  --line:#4C4535; --shadow:#000000; --btn:#FFD43B; --btn-fg:#16140F;
  --lie:#FF6FA3; --lie-soft:#3A1E29; --truth:#3CD3BB; --truth-soft:#173430; --warn:#FFB547; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45; padding-inline:16px; padding-block:0 48px}
.app{max-width:560px; margin:0 auto}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:18px 14px}
.wordmark{font-family:var(--display); font-size:26px; letter-spacing:.02em; line-height:1; margin:0; cursor:pointer}
.wordmark span{display:inline-block; background:var(--ink); color:var(--bg); padding:4px 10px 1px; transform:rotate(-3deg)}
.top small{font-size:12px; color:var(--muted); text-align:right; max-width:16ch}
h1,h2,h3{text-wrap:balance; margin:0}
.stack{display:flex; flex-direction:column; gap:16px}
.card{background:var(--surface); border:2px solid var(--line); border-radius:var(--r); box-shadow:4px 4px 0 var(--shadow); padding:18px; min-width:0}
.card.flat{box-shadow:none}
.eyebrow{font-size:12px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.label{display:block; font-size:13px; font-weight:700; margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.row > .grow{flex:1 1 160px; min-width:0}
.inp, textarea.inp{width:100%; font:inherit; font-size:17px; color:var(--ink); background:var(--surface); border:2px solid var(--line); border-radius:10px; padding:12px 14px; outline:none}
.inp:focus-visible, textarea.inp:focus-visible{box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--ink)}
textarea.inp{font-size:15px; min-height:96px; resize:vertical}
.inp.code{font-family:var(--mono); font-weight:700; letter-spacing:.3em; text-transform:uppercase; text-align:center; font-size:22px}
.btn{font:inherit; font-weight:800; font-size:16px; border:2px solid var(--line); background:var(--btn); color:var(--btn-fg); border-radius:12px; padding:12px 18px; cursor:pointer; box-shadow:3px 3px 0 var(--shadow); transition:transform .06s, box-shadow .06s}
.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)}
.btn:focus-visible, .ghost:focus-visible, .segb:focus-visible, .opt:focus-visible, .chip-btn:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none}
.btn.block{width:100%}
.btn.alt{background:var(--surface); color:var(--ink)}
.ghost{font:inherit; font-weight:700; font-size:14px; background:none; border:none; color:var(--muted); text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:6px 2px}
.seg{display:flex; flex-wrap:wrap; gap:8px}
.segb{font:inherit; font-weight:700; font-size:14px; padding:8px 12px; border-radius:999px; border:2px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer}
.segb.on{background:var(--ink); color:var(--surface)}
.hero h2{font-family:var(--display); font-size:clamp(28px,8vw,40px); line-height:1.02; letter-spacing:.01em}
.hero p{margin:10px 0 0; max-width:46ch}
.code-big{font-family:var(--mono); font-weight:700; font-size:clamp(44px,15vw,64px); letter-spacing:.18em; line-height:1}
.players{display:flex; flex-wrap:wrap; gap:8px}
.pchip{display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; border:2px solid var(--line); background:var(--surface-2); font-weight:700; font-size:14px; max-width:100%}
.pchip .dot{width:10px; height:10px; border-radius:50%; flex:none}
.pchip.done{background:var(--truth-soft)}
.pchip.wait{opacity:.6; border-style:dashed}
.pchip .tag{font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.pchip .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chip-btn{font:inherit; font-size:12px; font-weight:800; background:none; border:none; color:var(--lie); cursor:pointer; padding:0 2px}
.roundbar{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.roundbar .rn{font-family:var(--display); font-size:18px}
.timer{font-family:var(--mono); font-weight:700; font-size:20px; font-variant-numeric:tabular-nums}
.timer.low{color:var(--lie)}
.track{height:8px; border-radius:99px; background:var(--surface-2); border:2px solid var(--line); overflow:hidden; margin-top:8px}
.track i{display:block; height:100%; background:var(--ink); transition:width .25s linear}
.qcard{position:relative; padding-top:26px}
.qcard .pack{position:absolute; top:-13px; left:14px; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; background:var(--ink); color:var(--surface); padding:4px 9px; border-radius:6px}
.qtext{font-size:clamp(21px,5.6vw,27px); font-weight:800; line-height:1.22; text-wrap:balance}
.hint{margin-top:10px; font-size:14px; color:var(--muted)}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{font:inherit; text-align:left; width:100%; background:var(--surface); color:var(--ink); border:2px solid var(--line); border-radius:12px; padding:14px 16px; font-size:18px; font-weight:700; cursor:pointer; box-shadow:3px 3px 0 var(--shadow); display:flex; justify-content:space-between; gap:12px; align-items:center}
.opt:hover:not([disabled]){background:var(--surface-2)}
.opt[disabled]{cursor:default; box-shadow:none; opacity:.7}
.opt .mine{font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); flex:none}
.res{border:2px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--surface); display:flex; flex-direction:column; gap:8px; animation:pop .35s ease both}
.res.truth{background:var(--truth-soft); border-color:var(--truth)}
.res .who{font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase}
.res.truth .who{color:var(--truth)}
.res.lie .who{color:var(--lie)}
.res .txt{font-size:18px; font-weight:800}
.res .voters{font-size:14px; color:var(--muted)}
@keyframes pop{from{transform:translateY(6px)} to{transform:none}}
.points{display:flex; flex-wrap:wrap; gap:8px}
.pts{font-weight:800; font-size:14px; padding:5px 10px; border-radius:8px; background:var(--surface-2); border:2px solid var(--line)}
.pts b{font-family:var(--mono)}
.board{display:flex; flex-direction:column}
.brow{display:grid; grid-template-columns:34px 1fr auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line)}
.brow:last-child{border-bottom:none}
.brow .rk{font-family:var(--display); font-size:18px}
.brow .nm{font-weight:800; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.brow .sc{font-family:var(--mono); font-weight:700; font-variant-numeric:tabular-nums; font-size:18px}
.brow.first .rk, .brow.first .sc{color:var(--truth)}
.awards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.award{border:2px solid var(--line); border-radius:12px; padding:12px; background:var(--surface-2)}
.award .t{font-family:var(--display); font-size:15px}
.award .n{font-weight:800; margin-top:4px}
.award .d{font-size:13px; color:var(--muted)}
.rules{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px}
.rules b{font-family:var(--mono)}
.qlist{display:flex; flex-direction:column; gap:6px; max-height:220px; overflow:auto; margin-top:10px}
.qitem{display:flex; gap:8px; align-items:flex-start; font-size:14px; padding:8px 10px; background:var(--surface-2); border-radius:8px}
.qitem .qa{flex:1; min-width:0}
.qitem .qa i{color:var(--truth); font-style:normal; font-weight:700}
.banner{border:2px dashed var(--line); border-radius:12px; padding:12px 14px; font-size:14px; background:var(--surface-2)}
.banner.warn{border-color:var(--warn); color:var(--ink)}
.lobbyrow{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line)}
.lobbyrow:last-child{border-bottom:none}
.lobbyrow .c{font-family:var(--mono); font-weight:700; letter-spacing:.15em}
.err{color:var(--lie); font-weight:700; font-size:14px; min-height:1em}
.packgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px}
.pack-t{display:flex; gap:10px; align-items:flex-start; border:2px solid var(--line); border-radius:10px; padding:10px; cursor:pointer; background:var(--surface)}
.pack-t input{margin-top:3px; accent-color:var(--ink); width:18px; height:18px; flex:none}
.pack-t b{display:block; font-size:14px}
.pack-t span{font-size:12px; color:var(--muted)}
.locked{font-size:20px; font-weight:800; padding:12px 14px; border-radius:10px; background:var(--surface-2); border:2px dashed var(--line); word-break:break-word}
#toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:10px; font-weight:700; font-size:14px; max-width:calc(100% - 32px); z-index:5}
details summary{cursor:pointer; font-weight:800}
@media (prefers-reduced-motion: reduce){ .res{animation:none} .track i{transition:none} .btn{transition:none} }

html{-webkit-text-size-adjust:100%}
body{margin:0; min-height:100vh; padding-top:env(safe-area-inset-top,0px); padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.netbar{position:sticky; top:0; z-index:4; margin-inline:-16px; padding:8px 16px; background:var(--ink); color:var(--surface); font-size:14px; font-weight:700; text-align:center}
.sharerow{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
a.btn{text-decoration:none; display:inline-block}
.confirm{color:var(--lie)!important}
</style>
</head>

  <div class="netbar" id="netbar" hidden></div>
  <header class="top">

  <main id="main"></main>
</div>
<div id="toast" hidden></div>

/* ---------------- Networking: host ---------------- */
function openHostPeer(code){
  return new Promise((resolve, reject) => {
    const peer = new Peer(PREFIX + code.toLowerCase());
    let opened = false;
    peer.on("open", () => { opened = true; resolve(peer); });
    peer.on("error", e => {
      if (!opened){ try{ peer.destroy(); }catch(_){} reject(e); return; }
      if (e.type === "network" || e.type === "server-error" || e.type === "socket-error" || e.type === "socket-closed") setNet("Connection to the matchmaking server dropped. Retrying…");
    });
    peer.on("disconnected", () => { setTimeout(() => { try{ if (!peer.destroyed && peer.disconnected) peer.reconnect(); }catch(_){} }, 2000); });
    peer.on("open", () => setNet(null));
    peer.on("connection", conn => {
      conn.on("data", d => hostHandle(conn, d));
      conn.on("close", () => hostDrop(conn));
      conn.on("error", () => hostDrop(conn));
    });
  });
}
function hostHandle(conn, d){
  if (!d || typeof d !== "object") return;
  if (d.t === "hello"){
    const pid = String(d.pid||"").slice(0,40); if (!pid) return;
    conn.pid = pid;
    const old = NET.conns[pid]; if (old && old !== conn){ try{ old.close(); }catch(_){} }
    NET.conns[pid] = conn;
    const nick = String(d.nick||"Player").trim().slice(0,16) || "Player";
    const p = S.players[pid];
    S.players = {...S.players, [pid]: p ? {...p, nick, online:true} : {nick, joinedAt:Date.now(), online:true, answers:{}, votes:{}}};
    S.game = {...S.game, names:{...(S.game.names||{}), [pid]:nick}};
    commit(); return;
  }
  const pid = conn.pid; if (!pid || !S.players[pid]) return;
  if (d.t === "answer") applyAnswer(pid, d.k, d.v);
  else if (d.t === "vote") applyVote(pid, d.k, d.o);
  else if (d.t === "leave") removePlayer(pid, false);
}
function hostDrop(conn){
  const pid = conn.pid;
  if (pid && NET.conns[pid] === conn){
    delete NET.conns[pid];
    if (S.players[pid]){ S.players = {...S.players, [pid]: {...S.players[pid], online:false}}; commit(); }
  }
}
function applyAnswer(pid, k, v){
  const g = G(); if (!g || g.phase !== "answer" || k !== akey(g)) return;
  v = String(v||"").trim().replace(/\s+/g," ").slice(0,80); if (!v) return;
  const p = S.players[pid]; if (!p || (p.answers && p.answers[k])) return;
  if (g.cur.t === "fact" && tooClose(v, g.cur.answer)) return;
  S.players = {...S.players, [pid]: {...p, answers:{...(p.answers||{}), [k]:v}}};
  commit();
}
function applyVote(pid, k, o){
  const g = G(); if (!g || g.phase !== "vote" || k !== akey(g) || pid === g.cur.subjectId) return;
  const opt = (g.options||[]).find(x => x.id === o); if (!opt || opt.authors.includes(pid)) return;
  const p = S.players[pid]; if (!p || (p.votes && p.votes[k])) return;
  S.players = {...S.players, [pid]: {...p, votes:{...(p.votes||{}), [k]:o}}};
  commit();
}
function removePlayer(pid, notify){
  const rest = {...S.players}; delete rest[pid]; S.players = rest;
  const c = NET.conns[pid];
  if (c){ if (notify){ try{ c.send({t:"kicked"}); }catch(_){} } setTimeout(() => { try{ c.close(); }catch(_){} }, 400); delete NET.conns[pid]; }
  commit();
}
function commit(){
  save("bn_hosting", {code:S.code, game:S.game, players:S.players, at:Date.now()});
  const msg = {t:"state", game:S.game, players:S.players, hostNow:Date.now()};
  for (const c of Object.values(NET.conns)){ try{ if (c.open) c.send(msg); }catch(_){} }
  render();
}
async function doHost(resume){
  if (busy) return;
  if (!resume && needNick()) return;
  busy = true; cleanupNet();
  const err = $("#home-err");
  try{
    let peer = null, code = resume ? resume.code : null;
    for (let i = 0; i < (resume ? 10 : 6) && !peer; i++){
      if (!resume) code = randCode();
      if (err) err.textContent = resume ? "Reopening room " + code + "…" : "Creating a room…";
      try{ peer = await openHostPeer(code); }
      catch(e){
        if (e.type === "unavailable-id"){ if (resume) await sleep(4000); continue; }
        throw e;
      }
    }
    if (!peer) throw {type: resume ? "still-taken" : "no-code"};
    NET.peer = peer; NET.role = "host"; S.code = code;
    if (resume){
      S.game = resume.game;
      const ps = {}; for (const [id,p] of Object.entries(resume.players)) ps[id] = {...p, online: id === PID};
      S.players = ps;
    } else {
      S.game = freshGame(code);
      S.players = {[PID]: {nick:ME.nick, joinedAt:Date.now(), online:true, answers:{}, votes:{}}};
    }
    save("bn_last", null);
    keepAwake();
    commit();
  }catch(e){
    const msg = e && e.type === "still-taken" ? "The room is still closing on the server. Wait 30 seconds and try again."
      : e && (e.type === "network" || e.type === "server-error" || e.type === "socket-error") ? "Couldn't reach the matchmaking server. Check your internet and try again."
      : e && e.type === "browser-incompatible" ? "This browser can't run the game. Try Chrome or Safari."
      : "Couldn't create a room. Try again.";
    if (err) err.textContent = msg; else toast(msg);
    cleanupNet();
  }
  busy = false;
}

/* ---------------- Networking: client ---------------- */
function doJoin(raw, auto){
  if (!auto && needNick()) return;
  const code = String(raw||"").toUpperCase().replace(/[^A-Z]/g,"");
  const err = $("#home-err");
  if (code.length !== 4){ if (err) err.textContent = "Room codes are 4 letters."; return; }
  cleanupNet();
  NET.role = "client"; S.code = code; save("bn_last", code);
  if (err) err.textContent = "Looking for room " + code + "…";
  const peer = new Peer(); NET.peer = peer;
  peer.on("open", () => connectHost());
  peer.on("error", e => {
    if (NET.peer !== peer) return;
    if (e.type === "peer-unavailable"){
      if (!S.game) failJoin("No open room called " + code + ". Check the code, and make sure the host still has the game open.");
      else { setNet("Can't reach the host. Retrying…"); scheduleReconnect(); }
    } else if (e.type === "browser-incompatible"){ failJoin("This browser can't run the game. Try Chrome or Safari."); }
    else { setNet("Connection problem. Retrying…"); scheduleReconnect(); }
  });
  peer.on("disconnected", () => { setTimeout(() => { try{ if (NET.peer === peer && !peer.destroyed && peer.disconnected) peer.reconnect(); }catch(_){} }, 2000); });
  clearTimeout(NET.joinT);
  NET.joinT = setTimeout(() => { if (NET.role === "client" && !S.game) failJoin("Couldn't connect to room " + code + ". Check your internet and try again."); }, 20000);
}
function connectHost(){
  if (NET.role !== "client" || !NET.peer || NET.peer.destroyed) return;
  try{ NET.conn && NET.conn.close(); }catch(_){}
  const conn = NET.peer.connect(PREFIX + S.code.toLowerCase(), {reliable:true});
  NET.conn = conn;
  conn.on("open", () => { conn.send({t:"hello", pid:PID, nick:ME.nick || "Player"}); setNet(null); });
  conn.on("data", d => { if (NET.conn === conn) clientHandle(d); });
  conn.on("close", () => { if (NET.conn === conn && NET.role === "client"){ setNet("Lost connection to the host. Reconnecting…"); scheduleReconnect(); } });
  conn.on("error", () => { if (NET.conn === conn){ setNet("Lost connection to the host. Reconnecting…"); scheduleReconnect(); } });
}
function scheduleReconnect(){
  if (NET.role !== "client" || NET.retryT) return;
  NET.retryT = setTimeout(() => {
    NET.retryT = null;
    if (NET.role !== "client" || !NET.peer || NET.peer.destroyed) return;
    if (NET.peer.disconnected){ try{ NET.peer.reconnect(); }catch(_){} setTimeout(connectHost, 1500); }
    else connectHost();
  }, 3000);
}
function clientHandle(d){
  if (!d || typeof d !== "object") return;
  if (d.t === "state"){
    NET.offset = (d.hostNow || Date.now()) - Date.now();
    clearTimeout(NET.joinT);
    const first = !S.game;
    S.game = d.game; S.players = d.players || {};
    if (first) keepAwake();
    render();
  } else if (d.t === "kicked"){ goHome(); toast("The host removed you from the game."); }
  else if (d.t === "closed"){ goHome(); toast("The host closed the room."); }
}
function send(msg){
  if (NET.role === "host"){
    if (msg.t === "answer") applyAnswer(PID, msg.k, msg.v);
    else if (msg.t === "vote") applyVote(PID, msg.k, msg.o);
    return true;
  }
  if (NET.conn && NET.conn.open){ try{ NET.conn.send(msg); return true; }catch(_){} }
  return false;
}
function failJoin(msg){ goHome(); const e = $("#home-err"); if (e) e.textContent = msg; else toast(msg); }
function cleanupNet(){
  clearTimeout(NET.retryT); clearTimeout(NET.joinT); NET.retryT = NET.joinT = null;
  try{ NET.conn && NET.conn.close(); }catch(_){}

let wakeLock = null;

function screenKey(){
  if (!S.code || !G()) return "home:" + (NET.role||"") + (S.code||"");
  const g = G(), k = akey(g), me = S.players[ME.id] || {};
  if (!S.players[ME.id]) return "joining";
  switch (g.phase){
    case "lobby": return "lobby:" + (g.run||0) + ":" + isHost();
    case "answer": return "ans:" + k + ":" + !!(me.answers && me.answers[k]);
    case "vote": return "vote:" + k + ":" + !!(me.votes && me.votes[k]);
    case "reveal": return "rev:" + k;
    case "final": return "final:" + (g.run||0);
  }
  return "x";
}
function render(force){
  const key = screenKey();
  if (force || key !== S.key){
    S.key = key;
    const scr = buildScreen();
    $("#main").replaceChildren(scr.node);
    S.upd = scr.upd || null;
    window.scrollTo({top:0});
  }
  S.upd && S.upd();

}
function buildScreen(){
  if (!S.code || !G()) return scrHome();
  if (!S.players[ME.id]) return { node: el("div",{class:"banner", text:"Joining the room…"}) };
  const ph = G().phase;
  if (ph === "lobby") return scrLobby();
  if (ph === "answer") return scrAnswer();
  if (ph === "vote") return scrVote();
  if (ph === "reveal") return scrReveal();
  return scrFinal();
}

/* ---------------- Game flow (host) ---------------- */
function buildQuestions(n, playerCount){
  const used = new Set(load("bn_used", []));
  const fresh = (arr, f) => { const a = shuffle(arr); return a.filter(x=>!used.has(f(x))).concat(a.filter(x=>used.has(f(x)))); };
  const custom = CUSTOM.split("\n").map(l=>l.split("|")).filter(p=>p.length>=2 && p[0].trim() && p[1].trim()).map(p=>({t:"fact", text:p[0].trim().slice(0,200), answer:p.slice(1).join("|").trim().slice(0,80), pack:"Custom"}));
  let pool = [];
  for (const k of ["word","facts","desi"]) if (SET.packs[k]) pool.push(...PACKS[k].qs.map(([q,a])=>({t:"fact", text:q, answer:a, pack:PACKS[k].name})));
  pool = fresh(pool, x=>x.text);
  const facts = shuffle(custom).concat(pool);
  const friends = SET.packs.friends ? fresh(PACKS.friends.qs, x=>x).map(tpl=>({t:"friend", tpl, pack:PACKS.friends.name})) : [];
  let nf = friends.length ? (facts.length ? Math.max(1, Math.round(n/3)) : n) : 0;
  if (playerCount < 3 && facts.length) nf = Math.min(nf, 1);
  nf = Math.min(nf, friends.length);
  const nfact = Math.min(n - nf, facts.length);
  if (nfact + nf < n) nf = Math.min(friends.length, n - nfact);
  const chosen = shuffle(facts.slice(0, nfact).concat(friends.slice(0, nf)));
  save("bn_used", Array.from(used).concat(chosen.map(q=>q.text||q.tpl)).slice(-2000));
  return chosen;
}
function namesMap(g){ const m = Object.assign({}, g.names||{}); for (const id of Object.keys(S.players)) m[id] = S.players[id].nick || m[id] || "Player"; return m; }
function roundState(g, i){
  const q = g.questions[i];
  const cur = {i, t:q.t, pack:q.pack, text:q.text||"", answer:q.answer||null, subjectId:null};
  if (q.t === "friend"){
    const ids = present();
    const counts = {}; for (const r of g.questions.slice(0,i)) if (r.subjectId) counts[r.subjectId]=(counts[r.subjectId]||0)+1;
    const order = (g.subjects||[]).filter(id=>ids.includes(id)).concat(shuffle(ids.filter(id=>!(g.subjects||[]).includes(id))));
    const subj = order.slice().sort((a,b)=>(counts[a]||0)-(counts[b]||0))[0] || ids[0];
    cur.subjectId = subj;
    cur.text = q.tpl.split("{p}").join(nameOf(subj));
  }
  return {round:i, phase:"answer", phaseEndsAt:Date.now() + (g.settings.ansSec||60)*1000, cur, options:null, reveal:null};
}
function withSubject(questions, i, cur){ return questions.map((q,j) => j===i && cur.subjectId ? {...q, subjectId:cur.subjectId} : q); }
function startGame(){
  const g = G(), ids = present();
  const errEl = $("#start-err");
  if (ids.length < 2){ if (errEl) errEl.textContent = "You need at least 2 players."; return; }
  const qs = buildQuestions(SET.rounds, ids.length);
  if (!qs.length){ if (errEl) errEl.textContent = "Pick at least one question pack or add questions."; return; }
  const base = {...g, settings:{rounds:qs.length, ansSec:SET.ansSec, voteSec:SET.voteSec}, questions:qs, scores:{}, stats:{}, names:namesMap(g), subjects:shuffle(ids), run:(g.run||0)+1};
  const rs = roundState(base, 0);
  S.game = {...base, ...rs, questions:withSubject(base.questions, 0, rs.cur)};
  lastStamp = null;
  commit();
}
function eligibleVoters(g){ return present().filter(id => id !== (g.cur && g.cur.subjectId)); }
function allAnswered(g){ const k=akey(g); const ids=present(); return ids.length>0 && ids.every(id => S.players[id].answers && S.players[id].answers[k]); }
function allVoted(g){ const k=akey(g); const ids=eligibleVoters(g); return ids.length>0 && ids.every(id => S.players[id].votes && S.players[id].votes[k]); }
function toVote(g){
  const k = akey(g), cur = g.cur;
  const truth = cur.t==="fact" ? cur.answer : (S.players[cur.subjectId] && S.players[cur.subjectId].answers && S.players[cur.subjectId].answers[k]);
  if (!truth) return {phase:"reveal", phaseEndsAt:Date.now()+10000, options:[], reveal:{skipped:true, msg: nameOf(cur.subjectId) + " didn't answer in time, so nobody scores this round.", points:{}}};
  const opts = [{id:rid(), text:String(truth), truth:true, authors:[]}];
  const idx = {[norm(truth)]:0};
  for (const id of Object.keys(S.players).sort()){
    if (id === cur.subjectId) continue;
    const a = S.players[id].answers && S.players[id].answers[k];
    if (!a) continue;
    const n = norm(a);
    if (n in idx) opts[idx[n]].authors.push(id);
    else { idx[n] = opts.length; opts.push({id:rid(), text:String(a), truth:false, authors:[id]}); }
  }
  if (opts.length < 2) return {phase:"reveal", phaseEndsAt:Date.now()+10000, options:opts.map(o=>({...o, voters:[]})), reveal:{skipped:true, msg:"Nobody wrote a fake answer, so there was nothing to vote on.", points:{}}};
  return {phase:"vote", phaseEndsAt:Date.now()+(g.settings.voteSec||30)*1000, options:shuffle(opts), reveal:null};
}
function toReveal(g){
  const k = akey(g), cur = g.cur;
  const pts = {}, stats = JSON.parse(JSON.stringify(g.stats||{}));
  const add = (id, n) => { pts[id] = (pts[id]||0) + n; };
  const st = (id, f) => { stats[id] = stats[id] || {fooled:0, truths:0, gullible:0}; stats[id][f]++; };
  const opts = g.options.map(o => ({...o, voters:[]}));
  for (const id of Object.keys(S.players)){
    if (id === cur.subjectId) continue;
    const v = S.players[id].votes && S.players[id].votes[k];
    const o = opts.find(x => x.id === v);
    if (!o || o.authors.includes(id)) continue;
    o.voters.push(id);
    if (o.truth){ add(id, 2); st(id, "truths"); if (cur.subjectId) add(cur.subjectId, 1); }
    else { for (const a of o.authors){ add(a, 1); st(a, "fooled"); } st(id, "gullible"); }
  }
  const t = opts.find(o=>o.truth);
  for (const a of (t ? t.authors : [])){ add(a, 2); st(a, "truths"); }
  const scores = Object.assign({}, g.scores||{});
  for (const [id,n] of Object.entries(pts)) scores[id] = (scores[id]||0) + n;
  for (const id of Object.keys(S.players)) if (!(id in scores)) scores[id] = 0;
  return {phase:"reveal", phaseEndsAt:Date.now()+25000, options:opts, scores, stats, reveal:{skipped:false, points:pts}};
}
function toNext(g){
  const i = g.round + 1;
  if (i >= g.questions.length) return {phase:"final", phaseEndsAt:0};
  const rs = roundState(g, i);
  return {...rs, questions:withSubject(g.questions, i, rs.cur)};
}
function advance(){
  const g = G(); if (!g || !isHost()) return;
  const stamp = g.run + ":" + g.round + ":" + g.phase;
  if (lastStamp === stamp) return;
  lastStamp = stamp;
  let ch = null;
  if (g.phase === "answer") ch = toVote(g);
  else if (g.phase === "vote") ch = toReveal(g);
  else if (g.phase === "reveal") ch = toNext(g);
  if (!ch) return;
  S.game = {...g, ...ch, names:namesMap(g)};
  commit();
}
function hostTick(){
  const g = G(); if (!g || !isHost()) return;
  const t = Date.now();
  if (g.phase === "answer" && (allAnswered(g) || t >= g.phaseEndsAt)) advance();
  else if (g.phase === "vote" && (allVoted(g) || t >= g.phaseEndsAt)) advance();
  else if (g.phase === "reveal" && t >= g.phaseEndsAt) advance();
}
function endEarly(){ const g=G(); S.game = {...g, phase:"final", phaseEndsAt:0, names:namesMap(g)}; commit(); }
function playAgain(){
  const g=G();
  const ps = {}; for (const [id,p] of Object.entries(S.players)) if (p.online !== false) ps[id] = p;
  S.players = ps;
  S.game = {...g, phase:"lobby", round:-1, questions:[], cur:null, options:null, reveal:null, scores:{}, stats:{}, phaseEndsAt:0, names:namesMap(g)};
  commit();
}

/* ---------- Answer ---------- */
function scrAnswer(){
  const g = G(), k = akey(g), cur = g.cur, me = S.players[ME.id] || {};
  const mine = me.answers && me.answers[k];
  const isSubj = cur.subjectId === ME.id;
  const hint = cur.t === "friend"
    ? (isSubj ? "This one's about you. Write your real answer. Friends will try to spot it." : "Write what " + nameOf(cur.subjectId) + " might say. Fool the others into picking yours.")
    : "Write a fake answer convincing enough to fool your friends.";
  const status = el("div",{class:"players", id:"status"});
  let body;
  if (mine){
    body = el("div",{class:"card stack"}, el("div",{class:"eyebrow", text:isSubj ? "Your real answer" : "Your fake answer"}), el("div",{class:"locked", text:mine}), el("div",{class:"small muted", text:"Locked in. Waiting for everyone else."}));
  } else {
    const inp = el("input",{id:"ans", class:"inp", maxlength:"80", placeholder: isSubj ? "The truth…" : "Your lie…", autocomplete:"off"});
    const err = el("div",{class:"err"});
    const btn = el("button",{class:"btn", type:"button"}, "Lock it in");
    const submit = () => {
      const v = inp.value.trim().replace(/\s+/g," ");
      if (!v){ err.textContent = "Write something first."; return; }
      if (cur.t==="fact" && tooClose(v, cur.answer)){ err.textContent = "Too close to the real answer! Make up something else."; inp.select(); return; }
      if (!send({t:"answer", k, v})){ err.textContent = "Not connected to the host right now. Try again in a moment."; return; }
      btn.disabled = true; err.textContent = "";
      setTimeout(() => { if (document.body.contains(btn)){ btn.disabled = false; err.textContent = "The host didn't get that. Tap again."; } }, 6000);
    };
    btn.onclick = submit;
    inp.onkeydown = e => { if (e.key==="Enter") submit(); };
    body = el("div",{class:"card stack"}, el("label",{class:"label", for:"ans", text:isSubj ? "Your real answer" : "Your fake answer"}), el("div",{class:"row"}, el("div",{class:"grow"}, inp), btn), err);
    setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 50);
  }
  return { node: el("div",{class:"stack"}, roundHeader("Write"), questionCard(hint), body,
      el("div",{class:"card flat"}, el("div",{class:"eyebrow", text:"Who's done", style:"margin-bottom:8px"}), status), hostBar()),
    upd(){ status.replaceChildren(...statusChips(present(), id => S.players[id].answers && S.players[id].answers[k], "done", "writing")); } };
}

/* ---------- Vote ---------- */

  const g = G(), k = akey(g), cur = g.cur, me = S.players[ME.id] || {};

    body = el("div",{class:"card stack"}, el("div",{class:"eyebrow", text:"Your vote"}), el("div",{class:"locked", text:o ? o.text : "—"}), el("div",{class:"small muted", text:"Locked in. Waiting for the others."}));
  } else {

}

  const ids = Array.from(new Set(Object.keys(g.scores||{}).concat(present())));
  ids.sort((a,b)=>((g.scores||{})[b]||0)-((g.scores||{})[a]||0));
  let rank = 0, prev = null;
  return el("div",{class:"board"}, ...ids.map((id,i) => {
    const sc = (g.scores||{})[id]||0; if (sc !== prev){ rank = i+1; prev = sc; }
    return el("div",{class:"brow"+(rank===1?" first":"")}, el("span",{class:"rk", text:String(rank)}), el("span",{class:"nm", text:nameOf(id)+(id===ME.id?" (you)":"")}), el("span",{class:"sc", text:String(sc)}));
  }));
}
function namesList(ids){ return ids.map(id => nameOf(id) + (id===ME.id ? " (you)" : "")).join(", "); }
function scrReveal(){

  const parts = [roundHeader("Results"), questionCard(null)];
  if (rv.skipped){

  } else {

    parts.push(el("div",{class:"stack", style:"gap:10px"}, ...opts.map((o,i) => {
      const who = o.truth ? (cur.t==="friend" ? "The truth, from " + nameOf(cur.subjectId) : "The truth") : "Lie by " + namesList(o.authors);
      const voters = o.voters.length ? (o.truth ? "Spotted by " : "Fooled ") + namesList(o.voters) : (o.truth ? "Nobody found it" : "Nobody fell for it");
      const extra = o.truth && o.authors.length ? el("div",{class:"voters", text:"Mind readers who wrote the same thing: " + namesList(o.authors)}) : null;
      return el("div",{class:"res " + (o.truth ? "truth" : "lie"), style:"animation-delay:" + (i*0.12) + "s"},
        el("div",{class:"who", text:who}), el("div",{class:"txt", text:o.text}), el("div",{class:"voters", text:voters}), extra);
    })));

    parts.push(el("div",{class:"card flat"}, el("div",{class:"eyebrow", text:"Points this round", style:"margin-bottom:8px"}),
      pts.length ? el("div",{class:"points"}, ...pts.map(([id,n]) => el("span",{class:"pts"}, nameOf(id) + (id===ME.id?" (you)":"") + " ", el("b",{text:"+"+n})))) : el("div",{class:"small muted", text:"Nobody scored."})));

/* ---------- Final ---------- */
function scrFinal(){
  const g = G(), st = g.stats || {}, scores = g.scores || {};
  const ids = Array.from(new Set(Object.keys(scores).concat(present())));
  const best = (f) => { let top=null, v=0; for (const id of ids){ const n=(st[id]&&st[id][f])||0; if (n>v){ v=n; top=id; } } return top ? {id:top, v} : null; };
  const aw = [["Best Psycher","fooled", n=>"Fooled friends " + n + (n===1?" time":" times")],["Truth Seeker","truths", n=>"Found the truth " + n + (n===1?" time":" times")],["Most Gullible","gullible", n=>"Fell for " + n + (n===1?" lie":" lies")]]
    .map(([t,f,d]) => { const b = best(f); return b ? el("div",{class:"award"}, el("div",{class:"t", text:t}), el("div",{class:"n", text:nameOf(b.id)}), el("div",{class:"d", text:d(b.v)})) : null; }).filter(Boolean);
  const sorted = ids.slice().sort((a,b)=>(scores[b]||0)-(scores[a]||0));
  const winner = sorted[0];
  const tied = sorted.filter(id => (scores[id]||0) === (scores[winner]||0));
  return { node: el("div",{class:"stack"},
    el("section",{class:"hero"}, el("div",{class:"eyebrow", text:"Game over"}), el("h2",{text: tied.length>1 ? "It's a tie!" : nameOf(winner) + " wins!"})),
    el("div",{class:"card"}, el("div",{class:"eyebrow", text:"Final scores"}), scoreboard()),
    aw.length ? el("div",{class:"awards"}, ...aw) : null,
    isHost() ? el("button",{class:"btn block", type:"button", onclick:playAgain}, "Play again with this group") : el("div",{class:"banner small", text:"Waiting for " + nameOf(g.hostId) + " to start another game. You can stay in the room."}),
    el("div",{class:"row", style:"justify-content:center"}, leaveButton())) };
}

/* ---------------- Timer loop ---------------- */
function tick(){
  const g = G();
  const t = $("#timer"), bar = $("#bar");
  if (g && t && g.phaseEndsAt){
    const total = g.phase==="answer" ? g.settings.ansSec*1000 : g.phase==="vote" ? g.settings.voteSec*1000 : 25000;
    const left = Math.max(0, g.phaseEndsAt - now());
    const s = Math.ceil(left/1000);
    t.textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
    t.classList.toggle("low", s <= 10);
    if (bar) bar.style.width = Math.max(0, Math.min(100, left/total*100)) + "%";
  }
  hostTick();
}
setInterval(tick, 250);
window.addEventListener("load", boot);
</script>
